<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Style Dark Pomodoro Pro+</title>
    <style>
        :root {
            --bg-color: #191919;       
            --card-bg: #202020;        
            --border-color: #2f2f2f;   
            --text-main: #ffffff;
            --text-sub: #9b9b9b;
            --accent-color: #e25555;   
            --accent-break: #2eaadc;   
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .mode-indicator {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: #2c2c2c;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background-color: #373737; }
        button.primary { background-color: var(--accent-color); border-color: var(--accent-color); }
        button.secondary { background-color: #3e3e3e; }

        .settings {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            gap: 10px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .setting-group input {
            width: 50px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            padding: 4px;
            text-align: center;
        }

        /* ➕ 수동 추가 스타일 */
        .manual-section {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .manual-section input {
            width: 60px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            padding: 5px;
            text-align: center;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stats-title { font-size: 1rem; font-weight: 600; color: var(--text-main); }

        .toggle-container {
            display: flex;
            background-color: var(--bg-color);
            padding: 2px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .toggle-container button { padding: 3px 8px; font-size: 0.75rem; border: none; background: none; color: var(--text-sub); }
        .toggle-container button.active { background-color: var(--card-bg); color: var(--text-main); border-radius: 4px; }

        .chart-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 120px;
            padding-top: 10px;
            gap: 2px;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
            gap: 8px;
        }

        .bar-track {
            width: 100%;
            max-width: 16px;
            height: 90px;
            background-color: #232323;
            border-radius: 3px;
            display: flex;
            align-items: flex-end;
        }

        .bar-fill {
            width: 100%;
            height: 0%; 
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: height 0.4s ease;
        }

        .bar-label { font-size: 0.7rem; color: var(--text-sub); height: 14px; line-height: 14px; }
        .bar-wrapper.today .bar-label { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div id="modeLabel" class="mode-indicator">Focus Time</div>
        <div id="timer">25:00</div>
        
        <div class="controls">
            <button id="startBtn" class="primary">시작</button>
            <button id="resetBtn">리셋</button>
            <button id="skipBtn" class="secondary">건너뛰기</button>
        </div>

        <div class="settings">
            <div class="setting-group">
                <label for="focusInput">집중 (분)</label>
                <input type="number" id="focusInput" value="25" min="1" max="60">
            </div>
            <div class="setting-group">
                <label for="breakInput">휴식 (분)</label>
                <input type="number" id="breakInput" value="5" min="1" max="60">
            </div>
        </div>

        <div class="manual-section">
            <label for="manualInput">수동 시간 기록 (분):</label>
            <input type="number" id="manualInput" value="30" min="1" max="180">
            <button id="addManualBtn" style="padding: 5px 12px;">더하기</button>
        </div>
    </div>

    <div class="card">
        <div class="stats-header">
            <div class="stats-title" id="chartTitle">이번 주 통계</div>
            <div class="toggle-container">
                <button id="weekBtn" class="active" onclick="switchView('week')">주간</button>
                <button id="monthBtn" onclick="switchView('month')">월간</button>
            </div>
        </div>
        <div class="chart-container" id="chartContainer"></div>
    </div>
</div>

<script>
    let isFocusMode = true;
    let timeLeft = 25 * 60;
    let timerId = null;
    let currentView = 'week'; 
    let sessionFocusedSeconds = 0; 

    const timerDisplay = document.getElementById('timer');
    const modeLabel = document.getElementById('modeLabel');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');
    const focusInput = document.getElementById('focusInput');
    const breakInput = document.getElementById('breakInput');
    const manualInput = document.getElementById('manualInput');
    const addManualBtn = document.getElementById('addManualBtn');

    let memoryStorage = {};
    
    function getData() {
        try {
            return JSON.parse(localStorage.getItem('pomo_real_v2')) || {};
        } catch(e) { return memoryStorage; }
    }

    function saveData(data) {
        try {
            localStorage.setItem('pomo_real_v2', JSON.stringify(data));
        } catch(e) { memoryStorage = data; }
    }

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    function initTimer() {
        clearInterval(timerId);
        timerId = null;
        startBtn.textContent = '시작';
        sessionFocusedSeconds = 0; 
        const focusMin = parseInt(focusInput.value) || 25;
        const breakMin = parseInt(breakInput.value) || 5;
        timeLeft = (isFocusMode ? focusMin : breakMin) * 60;
        modeLabel.textContent = isFocusMode ? "Focus Time" : "Break Time";
        modeLabel.style.color = isFocusMode ? "var(--accent-color)" : "var(--accent-break)";
        updateDisplay();
    }

    function flushFocusedTime() {
        if (isFocusMode && sessionFocusedSeconds > 0) {
            const todayStr = new Date().toISOString().split('T')[0];
            let data = getData();
            data[todayStr] = (data[todayStr] || 0) + sessionFocusedSeconds;
            saveData(data);
            sessionFocusedSeconds = 0; 
            renderCSSChart();
        }
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            startBtn.textContent = '일시정지';
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    if (isFocusMode) { sessionFocusedSeconds++; }
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    flushFocusedTime(); 
                    
                    if (isFocusMode) {
                        alert('집중 완료! 휴식 시간입니다.');
                        isFocusMode = false;
                    } else {
                        alert('휴식 종료! 다시 힘내봐요.');
                        isFocusMode = true;
                    }
                    initTimer();
                }
            }, 1000);
        } else {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = '시작';
            flushFocusedTime(); 
        }
    });

    resetBtn.addEventListener('click', () => {
        flushFocusedTime();
        initTimer();
    });

    skipBtn.addEventListener('click', () => {
        flushFocusedTime(); 
        isFocusMode = !isFocusMode; 
        initTimer();
    });

    // 🛠️ 수동 시간 추가 이벤트 리스너
    addManualBtn.addEventListener('click', () => {
        const inputMins = parseInt(manualInput.value) || 0;
        if (inputMins <= 0) return;

        const todayStr = new Date().toISOString().split('T')[0];
        let data = getData();
        
        // 입력받은 '분'을 내부 연산 표준 단위인 '초'로 변환하여 저장
        data[todayStr] = (data[todayStr] || 0) + (inputMins * 60);
        saveData(data);
        
        renderCSSChart(); // 그래프에 즉시 반영
        alert(`${inputMins}분이 오늘 집중 시간에 수동으로 추가되었습니다!`);
        manualInput.value = 30; // 기본값 리셋
    });

    focusInput.addEventListener('change', () => { flushFocusedTime(); initTimer(); });
    breakInput.addEventListener('change', () => { flushFocusedTime(); initTimer(); });

    function switchView(view) {
        currentView = view;
        document.getElementById('weekBtn').classList.toggle('active', view === 'week');
        document.getElementById('monthBtn').classList.toggle('active', view === 'month');
        document.getElementById('chartTitle').textContent = view === 'week' ? '이번 주 통계 (월~일)' : '월간 통계 (최근 30일)';
        renderCSSChart();
    }

    function renderCSSChart() {
        const container = document.getElementById('chartContainer');
        container.innerHTML = '';
        const data = getData();
        const today = new Date();
        
        const chartData = [];
        let maxVal = 60; 

        if (currentView === 'week') {
            const currentDay = today.getDay(); 
            const distanceToMonday = currentDay === 0 ? 6 : currentDay - 1;
            const monday = new Date(today);
            monday.setDate(today.getDate() - distanceToMonday);

            const dayLabels = ['월', '화', '수', '목', '금', '토', '일'];

            for (let i = 0; i < 7; i++) {
                const nextDay = new Date(monday);
                nextDay.setDate(monday.getDate() + i);
                const dateStr = nextDay.toISOString().split('T')[0];
                
                const valInSeconds = data[dateStr] || 0;
                const valInMins = Math.round((valInSeconds / 60) * 10) / 10;
                
                if (valInMins > maxVal) maxVal = valInMins;
                
                chartData.push({
                    label: dayLabels[i],
                    value: valInMins,
                    isToday: nextDay.toDateString() === today.toDateString(),
                    barWidth: '16px'
                });
            }
        } else {
            for (let i = 29; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                
                const valInSeconds = data[dateStr] || 0;
                const valInMins = Math.round((valInSeconds / 60) * 10) / 10;
                
                if (valInMins > maxVal) maxVal = valInMins;
                
                const labelText = (i % 5 === 0) ? `${d.getDate()}일` : '';

                chartData.push({
                    label: labelText,
                    value: valInMins,
                    isToday: d.toDateString() === today.toDateString(),
                    barWidth: '5px'
                });
            }
        }

        chartData.forEach(day => {
            const pct = (day.value / maxVal) * 100;
            const wrapper = document.createElement('div');
            wrapper.className = `bar-wrapper ${day.isToday ? 'today' : ''}`;
            wrapper.title = `${day.value}분 집중함`;
            wrapper.innerHTML = `
                <div class="bar-track" style="max-width: ${day.barWidth};">
                    <div class="bar-fill" style="height: ${pct}%"></div>
                </div>
                <div class="bar-label" style="font-size: ${currentView === 'week' ? '0.75rem' : '0.6rem'}">${day.label}</div>
            `;
            container.appendChild(wrapper);
        });
    }

    initTimer();
    renderCSSChart();
</script>
</body>
</html>
